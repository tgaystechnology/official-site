<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Core globe outline and grids -->
  <circle cx="300" cy="300" r="240" stroke="#0083ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.15"/>
  <circle cx="300" cy="300" r="180" stroke="#0083ff" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.1"/>
  <circle cx="300" cy="300" r="120" stroke="#0083ff" stroke-width="1" opacity="0.08"/>
  
  <!-- Longitudinal ellipses -->
  <ellipse cx="300" cy="300" rx="240" ry="80" stroke="#0083ff" stroke-width="1" opacity="0.15" transform="rotate(15 300 300)"/>
  <ellipse cx="300" cy="300" rx="240" ry="140" stroke="#0083ff" stroke-width="1" opacity="0.1" transform="rotate(-30 300 300)"/>
  <ellipse cx="300" cy="300" rx="240" ry="60" stroke="#0083ff" stroke-width="1.2" opacity="0.15" transform="rotate(45 300 300)"/>
  <ellipse cx="300" cy="300" rx="240" ry="180" stroke="#0083ff" stroke-width="1" opacity="0.15" transform="rotate(75 300 300)"/>
  <ellipse cx="300" cy="300" rx="240" ry="100" stroke="#0083ff" stroke-width="1" opacity="0.1" transform="rotate(-60 300 300)"/>
  
  <!-- Network Nodes & Connecting Lines -->
  <g stroke="#0083ff" stroke-width="0.75" opacity="0.3">
    <!-- Outer boundary connections -->
    <line x1="300" y1="60" x2="480" y2="180" />
    <line x1="480" y1="180" x2="510" y2="320" />
    <line x1="510" y1="320" x2="420" y2="460" />
    <line x1="420" y1="460" x2="300" y2="540" />
    <line x1="300" y1="540" x2="180" y2="460" />
    <line x1="180" y1="460" x2="90" y2="320" />
    <line x1="90" y1="320" x2="120" y2="180" />
    <line x1="120" y1="180" x2="300" y2="60" />

    <!-- Cross connections to inner nodes -->
    <line x1="300" y1="60" x2="360" y2="180" />
    <line x1="300" y1="60" x2="240" y2="180" />
    <line x1="480" y1="180" x2="360" y2="180" />
    <line x1="480" y1="180" x2="400" y2="250" />
    <line x1="120" y1="180" x2="240" y2="180" />
    <line x1="120" y1="180" x2="200" y2="250" />
    
    <line x1="360" y1="180" x2="300" y2="200" />
    <line x1="240" y1="180" x2="300" y2="200" />
    <line x1="300" y1="200" x2="400" y2="250" />
    <line x1="300" y1="200" x2="200" y2="250" />
    
    <line x1="400" y1="250" x2="300" y2="300" />
    <line x1="200" y1="250" x2="300" y2="300" />
    <line x1="400" y1="250" x2="420" y2="360" />
    <line x1="200" y1="250" x2="180" y2="360" />
    
    <line x1="510" y1="320" x2="420" y2="360" />
    <line x1="90" y1="320" x2="180" y2="360" />
    
    <line x1="300" y1="300" x2="420" y2="360" />
    <line x1="300" y1="300" x2="180" y2="360" />
    <line x1="300" y1="300" x2="300" y2="400" />
    
    <line x1="420" y1="360" x2="300" y2="400" />
    <line x1="180" y1="360" x2="300" y2="400" />
    
    <line x1="420" y1="460" x2="300" y2="400" />
    <line x1="180" y1="460" x2="300" y2="400" />
    
    <!-- Extra random connecting lines -->
    <line x1="360" y1="180" x2="400" y2="250" />
    <line x1="240" y1="180" x2="200" y2="250" />
    <line x1="300" y1="200" x2="300" y2="300" />
    <line x1="420" y1="360" x2="420" y2="460" />
    <line x1="180" y1="360" x2="180" y2="460" />
    
    <path d="M 120 180 Q 300 150 480 180" fill="none" stroke="#0083ff" stroke-width="0.5" opacity="0.2"/>
    <path d="M 90 320 Q 300 350 510 320" fill="none" stroke="#0083ff" stroke-width="0.5" opacity="0.2"/>
    <path d="M 180 460 Q 300 420 420 460" fill="none" stroke="#0083ff" stroke-width="0.5" opacity="0.2"/>
  </g>
  
  <!-- Nodes (Dots) -->
  <g fill="#0083ff" opacity="0.6">
    <circle cx="300" cy="60" r="3.5" />
    <circle cx="480" cy="180" r="3.5" />
    <circle cx="510" cy="320" r="4" />
    <circle cx="420" cy="460" r="3.5" />
    <circle cx="300" cy="540" r="3.5" />
    <circle cx="180" cy="460" r="3.5" />
    <circle cx="90" cy="320" r="4" />
    <circle cx="120" cy="180" r="3.5" />

    <circle cx="300" cy="200" r="3" />
    <circle cx="400" cy="250" r="3" />
    <circle cx="420" cy="360" r="3" />
    <circle cx="300" cy="400" r="3" />
    <circle cx="180" cy="360" r="3" />
    <circle cx="200" cy="250" r="3" />
    <circle cx="300" cy="300" r="4.5" fill="#0060b6" />
    <circle cx="360" cy="180" r="2.5" />
    <circle cx="240" cy="180" r="2.5" />
  </g>
</svg>
